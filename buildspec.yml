version: 0.2

phases:
  install:
    commands:
      - echo "Installing dependencies..."
      - go mod download

  pre_build:
    commands:
      - echo "Running tests..."
      - go test ./... -v

  build:
    commands:
      - echo "Building binary..."
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/server main.go

artifacts:
  files:
    - bin/server
    - Procfile
    - .env
  discard-paths: no
