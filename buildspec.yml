version: 0.2

env:
  variables:
    HOME: "/root"
    GOCACHE: "/tmp/go-cache"
    GOPATH: "/go"

phases:
  install:
    commands:
      - echo "Setting up directories and dependencies..."
      - mkdir -p /tmp/go-cache
      - mkdir -p bin
      - go mod download

  pre_build:
    commands:
      - echo "Running tests..."
      - go test -v ./tests/...

  build:
    commands:
      - echo "Building Go binary..."
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/server main.go

artifacts:
  files:
    - bin/server
    - Procfile
    - .env
  discard-paths: no
